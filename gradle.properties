# PhoneSpeakerMic — Gradle Performance Config
# Jigar Corp · com.jigar.phonespeakermic

# ── JVM / Memory ──────────────────────────────────
org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=512m \
  -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError \
  -XX:+UseG1GC -XX:G1HeapRegionSize=16m -Dfile.encoding=UTF-8

# ── Parallelism ────────────────────────────────────
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.workers.max=4

# ── Build Cache ────────────────────────────────────
org.gradle.caching=true

# ── Kotlin ────────────────────────────────────────
kotlin.daemon.jvm.options=-Xmx2g -XX:+UseG1GC

# ── Android ───────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
