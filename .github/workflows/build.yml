name: "⚡ Build & Release APK"

on:
  push:
    branches: [main]
    tags:    ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🔨 Build Debug APK"
    runs-on: ubuntu-latest   # 7 GB RAM, 2 vCPUs

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Set up JDK 17 (Temurin — best G1GC)"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "📊 Runner resources"
        run: |
          echo "=== CPU ===" && nproc
          echo "=== RAM ===" && free -h
          echo "=== Disk ===" && df -h /
          java -version 2>&1

      - name: "🔑 gradlew permission"
        run: chmod +x gradlew

      - name: "🗄️ Gradle + Android build cache"
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: "🏗️ Build Debug APK (max RAM)"
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=4 \
            --build-cache \
            --parallel \
            --stacktrace
        env:
          # Feed every MB to Gradle — all on one line, no shell word-splitting issues
          GRADLE_OPTS: "-Xmx6g -Xms1g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC -XX:G1HeapRegionSize=32m -Xss16m -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx6g -Xss16m"

      - name: "📦 Stage APK"
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSION=$(grep versionName app/build.gradle | grep -oP '"[^"]+"' | tr -d '"')
          DATE=$(date +'%Y%m%d')
          NAME="PhoneSpeakerMic-v${VERSION}-${DATE}.apk"
          cp "$APK" "$NAME"
          echo "APK_NAME=$NAME"   >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -lh "$NAME"

      - name: "📤 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeakerMic-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30
          compression-level: 0

      - name: "📋 Step summary"
        run: |
          echo "## ⚡ PhoneSpeakerMic Build" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | \`${{ env.APK_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ env.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          SIZE=$(du -sh "${{ env.APK_NAME }}" | cut -f1)
          echo "| **Size** | $SIZE |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════
  release:
    name: "🚀 GitHub Release"
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Download APK"
        uses: actions/download-artifact@v4
        with:
          name: PhoneSpeakerMic-apk

      - name: "📄 Read changelog"
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md | head -60)
          else
            NOTES="See commits for changes."
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "🏷️ Create Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "⚡ PhoneSpeakerMic ${{ github.ref_name }}"
          body: |
            ## ⚡ PhoneSpeakerMic ${{ github.ref_name }}
            > Ultra-Low Latency Android Audio Bridge · By Jigar Corp

            ${{ steps.changelog.outputs.NOTES }}

            ---
            ### Install
            1. Download the APK below → install on Android (enable Unknown Sources)
            2. Run `python pc_server.py` on your Windows PC
            3. Pick your mode (Mic / Speaker / Both) → Connect!

            **Requires:** Android 6.0+ · PC: `pip install pyaudiowpatch numpy pycaw comtypes`

            ---
            **No Ads · No Subscriptions · Zero Tracking · Local First · Open Source Forever**
            Support: `arvindji@fam` · [Jigar Corp](https://official-arvind.github.io/jigar-tools/)
          files: "*.apk"
          draft: false
          prerelease: false
          generate_release_notes: false
